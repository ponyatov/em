#!/usr/bin/env shebang

# line comment
/* block comment */

# numbers:
-01 +02.30 -4e+5 0xDeadBeef 0o750 0b1101

:init
    nop halt
    jmp init
    call forward

forward:
    ret

# booleans
true false

# symbol
$symbol

# strings:
"Hello, World!" 'Single quote string'
"Escaped characters: \n\t\\\'\""

# null value
nil

# array:
[1, 2, 3, "four", true, [5, 6]]

# object:
{
  "name": 'John',
  "age": 30,
  "salary": 12345.67,
  "city": "New York",
  "isStudent": true,
  "friends": ["Jane", "Mike"]
}
