[package]
name        =  "evento"
version     =  "0.0.1"
description =  "Embedded Programming Language Prototype"
authors     = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
license     =  "MIT"
repository  =  "https://github.com/ponyatov/Evento"
edition     =  "2024"

[[bin]]
name  = "flang"
test  = false
bench = false

[workspace]
members = ["fvm"]

[[bin]]
path = "src/main.rs"
name = "F"

# [lib]
# path = "src/vm.rs"
# crate-type = ["cdylib"]
# name = "vm"
# # bench = false

[dependencies]
const_format = "0.2"

[target.'cfg(all(target_os = "linux"))'.dependencies]
libc = "0.2"

[target.x86_64-unknown-linux-gnu.dependencies]
xdpilone = "1.2"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-semihosting = "0.6"

[features]

# hw
## x86
pc              = ["i5"]
## rpi
rpi3            = ["bcm2837"]
rpi4            = ["bcm2711"]
rpi5            = ["bcm2712"]
opi800          = ["rk3399"]
## stm32
netduinoplus2   = ["stm32f405rg"]
iskra           = ["stm32f405rg"]
f4disco         = ["stm32f407vg"]
f429disco       = ["stm32f429zi"]
pillf103        = ["stm32f103c8"]
## esp
esp8266         = ["xtensa","rtos8266"]
esp32           = ["xtensa","idf"]
# cpu
## x86
i5              = ["x86_64","linux"]
i486            = ["i386"  ,"none" ]
i686            = ["i386"  ,"win32"]
## aarch64
bcm2837         = ["aarch64"]
bcm2711         = ["aarch64"]
bcm2712         = ["aarch64"]
rk3399          = ["aarch64"]
## cortex
stm32f103c8     = ["stm32f1"]
stm32f405rg     = ["stm32f4"]
stm32f407vg     = ["stm32f4"]
stm32f429zi     = ["stm32f4"]
lx106           = []
# series
stm32f1         = ["cortexm3"]
stm32f4         = ["cortexm4"]
# arch
x86_64          = ["linux"]
i386            = ["linux"]
aarch64         = ["linux"]
cortexm         = ["none"]
cortexm3        = ["cortexm"]
cortexm4        = ["cortexm"]
xtensa          = ["lx106"]
# os
linux           = []
win32           = []
none            = []
rtos8266        = []
idf             = []
